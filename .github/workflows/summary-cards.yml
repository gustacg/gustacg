name: Perfil, cartões de resumo

on:
  schedule:
    - cron: "10 6 * * *" # 03:10 em São Paulo
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # PROFILE_PAT é um token de leitura dos repositórios privados, para os totais
          # contarem o trabalho fechado sem imprimir nome de repositório. Sem ele, o
          # GITHUB_TOKEN padrão gera os cartões só com o que é público.
          GITHUB_TOKEN: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: -3
          AUTO_PUSH: true
